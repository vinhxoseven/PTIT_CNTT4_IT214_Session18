services:
  redis:
    image: redis:7
    container_name: rikkeibank-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: rikkeibank-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  identity-db:
    image: mysql:8.4
    environment: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: identity_db}
    ports: ["3307:3306"]
    volumes: ["identity_data:/var/lib/mysql"]
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"], interval: 5s, timeout: 5s, retries: 20}
  customer-db:
    image: mysql:8.4
    environment: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: customer_db}
    ports: ["3308:3306"]
    volumes: ["customer_data:/var/lib/mysql"]
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"], interval: 5s, timeout: 5s, retries: 20}
  account-db:
    image: mysql:8.4
    environment: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: account_db}
    ports: ["3309:3306"]
    volumes: ["account_data:/var/lib/mysql"]
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"], interval: 5s, timeout: 5s, retries: 20}
  transaction-db:
    image: mysql:8.4
    environment: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: transaction_db}
    ports: ["3310:3306"]
    volumes: ["transaction_data:/var/lib/mysql"]
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"], interval: 5s, timeout: 5s, retries: 20}

  config-server:
    build: {context: ., dockerfile: config-server/Dockerfile}
    ports: ["8888:8888"]
    volumes: ["./config-repo:/config-repo:ro"]
    environment: {CONFIG_REPO_PATH: /config-repo}

  discovery-server:
    restart: on-failure
    build: {context: ., dockerfile: discovery-server/Dockerfile}
    ports: ["8761:8761"]
    depends_on: [config-server]
    environment: {CONFIG_SERVER_URL: http://config-server:8888}

  api-gateway:
    restart: on-failure
    build: {context: ., dockerfile: api-gateway/Dockerfile}
    ports: ["8080:8080"]
    depends_on: [config-server, discovery-server, redis]
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      REDIS_HOST: redis
      JWT_SECRET: RikkeiBank-2026-Super-Secret-Key-Change-Me-At-Least-32-Bytes

  identity-service:
    restart: on-failure
    build: {context: ., dockerfile: identity-service/Dockerfile}
    depends_on: [config-server, discovery-server, identity-db, redis]
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      IDENTITY_DB_URL: jdbc:mysql://identity-db:3306/identity_db?useSSL=false&allowPublicKeyRetrieval=true
      IDENTITY_DB_USER: root
      IDENTITY_DB_PASSWORD: root
      REDIS_HOST: redis
      JWT_SECRET: RikkeiBank-2026-Super-Secret-Key-Change-Me-At-Least-32-Bytes

  customer-service:
    restart: on-failure
    build: {context: ., dockerfile: customer-service/Dockerfile}
    depends_on: [config-server, discovery-server, customer-db, redis]
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      CUSTOMER_DB_URL: jdbc:mysql://customer-db:3306/customer_db?useSSL=false&allowPublicKeyRetrieval=true
      CUSTOMER_DB_USER: root
      CUSTOMER_DB_PASSWORD: root
      REDIS_HOST: redis
      JWT_SECRET: RikkeiBank-2026-Super-Secret-Key-Change-Me-At-Least-32-Bytes

  account-service:
    restart: on-failure
    build: {context: ., dockerfile: account-service/Dockerfile}
    depends_on: [config-server, discovery-server, account-db, redis]
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      ACCOUNT_DB_URL: jdbc:mysql://account-db:3306/account_db?useSSL=false&allowPublicKeyRetrieval=true
      ACCOUNT_DB_USER: root
      ACCOUNT_DB_PASSWORD: root
      REDIS_HOST: redis
      JWT_SECRET: RikkeiBank-2026-Super-Secret-Key-Change-Me-At-Least-32-Bytes
      INTERNAL_KEY: RikkeiBank-Internal-2026

  transaction-service:
    restart: on-failure
    build: {context: ., dockerfile: transaction-service/Dockerfile}
    depends_on: [config-server, discovery-server, transaction-db, kafka, account-service]
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      TRANSACTION_DB_URL: jdbc:mysql://transaction-db:3306/transaction_db?useSSL=false&allowPublicKeyRetrieval=true
      TRANSACTION_DB_USER: root
      TRANSACTION_DB_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: RikkeiBank-2026-Super-Secret-Key-Change-Me-At-Least-32-Bytes
      INTERNAL_KEY: RikkeiBank-Internal-2026

  notification-service:
    restart: on-failure
    build: {context: ., dockerfile: notification-service/Dockerfile}
    depends_on: [config-server, discovery-server, kafka]
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: RikkeiBank-2026-Super-Secret-Key-Change-Me-At-Least-32-Bytes

volumes:
  identity_data:
  customer_data:
  account_data:
  transaction_data:
